[project]
name = "signal-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["signal-core", "signal-api", "signal-worker", "signal-scheduler"]

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker", "apps/scheduler"]

[tool.uv.sources]
signal-core = { workspace = true }
signal-api = { workspace = true }
signal-worker = { workspace = true }
signal-scheduler = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21", "freezegun>=1.5",
  "ruff>=0.7", "mypy>=1.13", "types-PyYAML", "types-python-dateutil", "asgi-lifespan>=2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs Postgres", "live: needs network / real Claude (skipped by default)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["packages/core/signal_core/db/migrations/versions", "scripts/pdf2md.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["signal_core", "signal_api", "signal_worker", "signal_scheduler"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
