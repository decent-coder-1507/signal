# Compose project "signal". Infra services always; app services under profile "full" (Linux/VPS deploy, ADR-002).
name: signal
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal}
      POSTGRES_DB: signal
    ports: ["${SIGNAL_DB_PORT:-5442}:5432"]
    volumes: ["signal_pg:/var/lib/postgresql/data", "./scripts/db-init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U signal"], interval: 5s, retries: 20}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["${SIGNAL_REDIS_PORT:-6390}:6379"]
    volumes: ["signal_redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20}
    restart: unless-stopped
  api:
    profiles: [full]
    build: {context: ., dockerfile: deploy/python.Dockerfile, network: host}
    command: uv run --no-sync uvicorn signal_api.main:app --host 0.0.0.0 --port 8710
    env_file: [{path: .env, required: false}]
    environment: {SIGNAL_DATABASE_URL: "postgresql+asyncpg://signal:${POSTGRES_PASSWORD:-signal}@db:5432/signal", SIGNAL_REDIS_URL: "redis://redis:6379/0", SIGNAL_USE_REDIS_QUEUE: "true"}
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    volumes: ["./data:/app/data", "claude_home:/home/signal/.claude"]
    ports: ["8710:8710"]
  worker:
    profiles: [full]
    build: {context: ., dockerfile: deploy/python.Dockerfile, network: host}
    command: uv run --no-sync arq signal_worker.main.WorkerSettings
    env_file: [{path: .env, required: false}]
    environment: {SIGNAL_DATABASE_URL: "postgresql+asyncpg://signal:${POSTGRES_PASSWORD:-signal}@db:5432/signal", SIGNAL_REDIS_URL: "redis://redis:6379/0", SIGNAL_USE_REDIS_QUEUE: "true"}
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    volumes: ["./data:/app/data", "claude_home:/home/signal/.claude"]
  scheduler:
    profiles: [full]
    build: {context: ., dockerfile: deploy/python.Dockerfile, network: host}
    command: uv run --no-sync python -m signal_scheduler.main
    env_file: [{path: .env, required: false}]
    environment: {SIGNAL_DATABASE_URL: "postgresql+asyncpg://signal:${POSTGRES_PASSWORD:-signal}@db:5432/signal", SIGNAL_REDIS_URL: "redis://redis:6379/0", SIGNAL_USE_REDIS_QUEUE: "true"}
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  web:
    profiles: [full]
    build: {context: ., dockerfile: deploy/web.Dockerfile, network: host, args: {SIGNAL_API_URL: "http://api:8710"}}
    environment: {SIGNAL_API_URL: "http://api:8710"}
    ports: ["3710:3710"]
    depends_on: [api]
  toolbox:
    # Linux dev/test toolbox (ADR-024): `python scripts/dev.py linux <cmd>`
    profiles: [dev]
    build: {context: ., dockerfile: deploy/toolbox.Dockerfile, network: host}
    network_mode: host
    volumes:
      - .:/workspace
      - toolbox_venv:/venv
      - toolbox_node_modules:/workspace/node_modules
      - toolbox_web_node_modules:/workspace/apps/web/node_modules
      - toolbox_next:/workspace/apps/web/.next
      - toolbox_browsers:/ms-playwright
      - toolbox_cache:/root/.cache
      - toolbox_pnpm:/root/.local/share/pnpm
  caddy:
    profiles: [vps]
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: {SIGNAL_DOMAIN: "${SIGNAL_DOMAIN:-localhost}"}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "signal_caddy:/data"]
volumes: {signal_pg: {}, signal_redis: {}, signal_caddy: {}, claude_home: {},
  # fixed names: git worktrees (other compose project names) share the same Linux caches
  toolbox_venv: {name: signal_toolbox_venv},
  toolbox_node_modules: {name: signal_toolbox_node_modules},
  toolbox_web_node_modules: {name: signal_toolbox_web_node_modules},
  toolbox_next: {name: signal_toolbox_next},
  toolbox_browsers: {name: signal_toolbox_browsers},
  toolbox_cache: {name: signal_toolbox_cache},
  toolbox_pnpm: {name: signal_toolbox_pnpm}}

# ADR-023: WSL's eth0 has MTU 1400; Docker bridges default to 1500, which stalls large TLS downloads.
# Scoped to this project's network only (the daemon config and other projects are untouched).
networks:
  default:
    driver_opts: {com.docker.network.driver.mtu: "1400"}
