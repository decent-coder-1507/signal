# LLM budget & routing (§15.2–15.3). Models are Claude Code CLI aliases (ADR-001/006), verified 2026-11-06.
# Prices: https://platform.claude.com/docs/en/about-claude/pricing (fetched 2026-11-06). USD per MTok.
# Used only to compute notional "API-equivalent" cost for the budget guard; the Runner bills against the subscription.
monthly_usd: 30
soft_limit_pct: 80
provider: claude_runner        # claude_runner | mock (forced to mock when SIGNAL_MODE=mock)
models: {fast: haiku, balanced: sonnet, deep: opus}
model_ids: {haiku: claude-haiku-5-5, sonnet: claude-sonnet-5-5, opus: claude-opus-5-5, fable: claude-fable-5-1}
prices_per_mtok:
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.10, cache_write: 2.50}
  claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.20, cache_write: 5.0}
  claude-fable-5-1: {input: 10.0, output: 50.0, cache_read: 0.25, cache_write: 12.50}
cache_ttl_hours: 168
max_calls_per_day: 600         # subscription courtesy cap (5-hour/weekly limits are shared with interactive use)
use_batch_api_for: []          # Batches API not available through the Runner (ADR-001)
task_max_tokens:
  enrich_items: 6000
  story_insight: 2500
  writer: 3000
  build_brief: 8000
  moat_radar: 6000
