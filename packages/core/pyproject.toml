[project]
name = "signal-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9", "pydantic-settings>=2.6", "pyyaml>=6", "jinja2>=3.1", "python-frontmatter>=1.1",
  "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30", "alembic>=1.14", "pgvector>=0.3.6", "psycopg[binary]>=3.2",
  "uuid-utils>=0.9", "httpx>=0.28", "feedparser>=6.0.11", "trafilatura>=2.0", "pypdf>=5.1", "langdetect>=1.0.9",
  "numpy>=2.1", "croniter>=5.0", "argon2-cffi>=23.1", "pyotp>=2.9", "structlog>=24.4", "python-dateutil>=2.9",
  "arq>=0.26", "redis>=5.2", "mcp>=1.2", "tzdata>=2024.2", "defusedxml>=0.7.1",
]
[project.optional-dependencies]
local-embeddings = ["fastembed>=0.4"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["signal_core"]
