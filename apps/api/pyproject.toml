[project]
name = "signal-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["signal-core", "fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.17", "prometheus-client>=0.21", "itsdangerous>=2.2"]
[tool.uv.sources]
signal-core = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["signal_api"]
